name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.x
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  package:
    name: Inspect release artifact
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify:docs
      - run: pnpm run verify:release
      - run: pnpm exec publint packages/bundle
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --dir packages/bundle publish --dry-run --access public --no-git-checks
      - run: pnpm run pack:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-branchmark-package
          path: dist/*.tgz
          if-no-files-found: error
