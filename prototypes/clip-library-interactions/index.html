<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BranchMark 枝签库交互原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f4f5f8;
      --panel: rgba(255, 255, 255, .96);
      --surface: #fff;
      --surface-2: #f7f8fb;
      --surface-3: #eef2f9;
      --text: #181b22;
      --text-2: #616978;
      --text-3: #9299a7;
      --border: #e1e4ea;
      --border-2: #cdd2dc;
      --brand: #4e7cf3;
      --brand-2: #2f61e8;
      --brand-soft: #edf3ff;
      --danger: #e84d4d;
      --pin: #d98c20;
      --shadow: 0 18px 58px rgba(25, 34, 55, .14);
      --shadow-sm: 0 8px 24px rgba(25, 34, 55, .09);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(circle at 80% -20%, #e8efff 0, transparent 36%), var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; }
    svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .app { width: min(1180px, calc(100vw - 32px)); min-height: calc(100vh - 32px); margin: 16px auto 104px; border: 1px solid var(--border); border-radius: 24px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
    .header { display: flex; min-height: 76px; align-items: center; gap: 14px; padding: 16px 22px; border-bottom: 1px solid var(--border); }
    .brand-icon { display: grid; width: 42px; height: 42px; flex: 0 0 42px; place-items: center; border-radius: 13px; background: #f0effb; color: #747d99; }
    .heading { min-width: 0; flex: 1; }
    .heading strong, .heading span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .heading strong { font-size: 18px; }
    .heading span { margin-top: 4px; color: var(--text-3); font-size: 12px; }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { display: inline-grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--text-2); cursor: pointer; }
    .icon-btn:hover { background: var(--surface-3); color: var(--text); }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 18px 6px; }
    .tab { height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--text-3); font-size: 16px; cursor: default; }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .toolbar { display: flex; align-items: center; gap: 9px; padding: 12px 22px; }
    .search { position: relative; min-width: 0; flex: 1; }
    .search svg { position: absolute; top: 50%; left: 13px; width: 17px; height: 17px; color: var(--text-3); transform: translateY(-50%); }
    .search input { width: 100%; height: 40px; padding: 0 14px 0 40px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--surface); color: var(--text); }
    .search input:focus { border-color: color-mix(in srgb, var(--brand) 52%, var(--border)); box-shadow: 0 0 0 3px var(--brand-soft); }
    .hint { padding: 0 22px 12px; color: var(--text-3); font-size: 12px; }
    .tag-row { display: flex; gap: 8px; padding: 0 22px 14px; overflow-x: auto; }
    .tag { flex: 0 0 auto; padding: 7px 10px; border: 0; border-radius: 999px; background: var(--brand-soft); color: var(--brand-2); font-size: 12px; }
    .content { padding: 0 22px 118px; }
    .section-label { display: flex; align-items: center; gap: 7px; margin: 8px 2px 10px; color: var(--text-2); font-size: 12px; font-weight: 600; }
    .section-label .line { height: 1px; flex: 1; background: var(--border); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .clip-card { position: relative; display: grid; height: 286px; grid-template-rows: auto auto 1fr auto; gap: 10px; padding: 15px; overflow: hidden; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); box-shadow: 0 1px 0 rgba(20, 25, 38, .02); transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease; }
    .clip-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .clip-card.selected { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 16%, transparent), var(--shadow-sm); }
    .clip-card.dragging { opacity: .42; transform: scale(.98); }
    .clip-card.drag-target { border-style: dashed; border-color: var(--brand); }
    .clip-card.inline-expanded { height: auto; min-height: 286px; grid-column: 1 / -1; }
    .card-top { display: flex; min-width: 0; align-items: center; gap: 7px; color: var(--text-3); font-size: 11px; }
    .dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #9568e9; }
    .drag-handle { display: inline-grid; width: 22px; height: 22px; margin-left: -6px; place-items: center; border: 0; background: transparent; color: var(--text-3); cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .drag-handle svg { width: 15px; height: 15px; }
    .card-top .meta { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pin { display: inline-flex; height: 25px; align-items: center; gap: 4px; padding: 0 7px; border: 0; border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; }
    .pin svg { width: 14px; height: 14px; }
    .pin.active { background: #fff5e6; color: var(--pin); }
    .check { display: grid; width: 25px; height: 25px; place-items: center; border: 1px solid var(--border-2); border-radius: 8px; background: var(--surface); color: transparent; cursor: pointer; }
    .check.checked { border-color: var(--brand); background: var(--brand); color: #fff; }
    .check svg { width: 15px; height: 15px; stroke-width: 2.4; }
    .excerpt-wrap { min-height: 0; }
    .excerpt { display: -webkit-box; margin: 0; overflow: hidden; color: var(--text); font-size: 18px; font-weight: 540; line-height: 1.65; -webkit-box-orient: vertical; -webkit-line-clamp: 4; }
    .inline-expanded .excerpt { display: block; overflow: visible; -webkit-line-clamp: unset; }
    .source { overflow: hidden; color: var(--text-3); text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .derived { align-self: start; padding: 9px 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text-2); font-size: 11px; }
    .derived strong { color: var(--text); }
    .card-actions { display: flex; min-width: 0; align-items: center; gap: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
    .card-action { display: inline-flex; min-width: 0; height: 29px; align-items: center; justify-content: center; gap: 5px; padding: 0 7px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 11px; white-space: nowrap; }
    .card-action:hover { background: var(--surface-3); color: var(--text); }
    .card-action svg { width: 15px; height: 15px; }
    .card-action.danger { margin-left: auto; color: var(--danger); }
    .empty-note { color: var(--text-3); font-size: 11px; }

    .batch-bar { position: fixed; z-index: 20; right: max(18px, calc((100vw - min(1180px, calc(100vw - 32px))) / 2 + 22px)); bottom: 66px; left: max(18px, calc((100vw - min(1180px, calc(100vw - 32px))) / 2 + 22px)); display: flex; min-height: 64px; align-items: center; gap: 7px; padding: 10px 12px; border: 1px solid var(--border-2); border-radius: 18px; background: rgba(255, 255, 255, .93); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .batch-summary { display: flex; min-width: 102px; align-items: center; gap: 8px; padding: 0 8px; }
    .count { display: grid; min-width: 27px; height: 27px; place-items: center; padding: 0 7px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-2); font-size: 12px; font-weight: 700; }
    .summary-copy strong, .summary-copy span { display: block; }
    .summary-copy strong { font-size: 12px; }
    .summary-copy span { margin-top: 2px; color: var(--text-3); font-size: 9px; }
    .bar-spacer { flex: 1; }
    .action { display: inline-flex; height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 12px; white-space: nowrap; }
    .action:hover { background: var(--surface-3); color: var(--text); }
    .action.primary { border-color: var(--brand); background: var(--brand); color: #fff; box-shadow: 0 7px 18px rgba(78, 124, 243, .28); }
    .action.primary:hover { background: var(--brand-2); }
    .action.danger { color: var(--danger); }
    .action.icon-only { width: 38px; padding: 0; }
    .action:disabled { opacity: .38; cursor: default; }
    .action-menu { position: absolute; right: 10px; bottom: calc(100% + 8px); display: none; width: 190px; padding: 7px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow); }
    .action-menu.open { display: grid; }
    .menu-item { display: flex; height: 36px; align-items: center; gap: 9px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; text-align: left; }
    .menu-item:hover { background: var(--surface-3); color: var(--text); }
    .menu-item.danger { color: var(--danger); }

    .command-capsule { position: fixed; z-index: 20; bottom: 66px; left: 50%; display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border-2); border-radius: 999px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); transform: translateX(-50%); backdrop-filter: blur(18px); }
    .capsule-button { display: inline-flex; height: 42px; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--brand); color: #fff; cursor: pointer; }
    .command-sheet { position: fixed; z-index: 22; bottom: 124px; left: 50%; display: none; width: min(440px, calc(100vw - 28px)); padding: 12px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); transform: translateX(-50%); }
    .command-sheet.open { display: block; }
    .command-sheet header { display: flex; align-items: center; justify-content: space-between; padding: 4px 5px 10px; }
    .command-sheet header strong { font-size: 13px; }
    .command-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .command { display: grid; min-height: 76px; place-items: center; gap: 7px; padding: 10px 6px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 11px; }
    .command:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-2); }

    .tray { position: fixed; z-index: 20; right: 18px; bottom: 66px; left: 18px; display: grid; max-width: 1120px; min-height: 88px; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; margin: auto; padding: 10px; border: 1px solid var(--border-2); border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); backdrop-filter: blur(18px); }
    .tray-list { display: flex; min-width: 0; align-items: stretch; gap: 8px; overflow-x: auto; }
    .tray-item { display: grid; width: 180px; flex: 0 0 180px; grid-template-columns: 18px 1fr 22px; align-items: center; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: grab; }
    .tray-item.dragging { opacity: .4; }
    .tray-order { color: var(--brand); font-size: 11px; font-weight: 700; }
    .tray-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .tray-remove { border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
    .tray-actions { display: flex; align-items: center; gap: 7px; }
    .tray-title { display: none; }

    .focus-backdrop { position: fixed; z-index: 40; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(19, 23, 33, .38); backdrop-filter: blur(8px); }
    .focus-backdrop.open { display: flex; }
    .focus-panel { display: grid; width: min(760px, 100%); max-height: min(760px, calc(100vh - 40px)); grid-template-rows: auto 1fr auto; overflow: hidden; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: 0 26px 100px rgba(12, 18, 32, .3); }
    .focus-header, .focus-footer { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .focus-header strong { min-width: 0; flex: 1; }
    .focus-body { overflow: auto; padding: 24px; }
    .focus-body article { font-size: 18px; line-height: 1.8; white-space: pre-wrap; }
    .focus-footer { justify-content: flex-end; border-top: 1px solid var(--border); border-bottom: 0; }
    .toast { position: fixed; z-index: 60; top: 20px; left: 50%; padding: 10px 14px; border: 1px solid var(--border-2); border-radius: 999px; background: #1d2230; color: #fff; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translate(-50%, -12px); transition: opacity 180ms ease, transform 180ms ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .composer-demo { position: fixed; z-index: 21; right: 22px; bottom: 144px; display: none; min-width: 260px; max-width: min(480px, calc(100vw - 44px)); padding: 11px 13px; border: 1px solid var(--brand); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); color: var(--text-2); font-size: 11px; }
    .composer-demo.show { display: block; animation: rise 160ms ease-out; }
    .composer-demo strong { color: var(--text); }
    .composer-chip { display: inline-flex; margin-top: 8px; padding: 5px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-2); }
    .prototype-switcher { position: fixed; z-index: 80; bottom: 10px; left: 50%; display: flex; height: 42px; align-items: center; gap: 8px; padding: 5px; border: 1px solid #3a4050; border-radius: 999px; background: #1e2330; color: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.3); transform: translateX(-50%); }
    .prototype-switcher button { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; }
    .prototype-switcher button:hover { background: #353c4e; }
    .variant-label { min-width: 170px; text-align: center; font-size: 11px; }
    .state-line { position: fixed; z-index: 18; top: 10px; left: 50%; max-width: calc(100vw - 24px); padding: 6px 10px; overflow: hidden; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.88); color: var(--text-3); text-overflow: ellipsis; white-space: nowrap; box-shadow: var(--shadow-sm); transform: translateX(-50%); font-size: 9px; backdrop-filter: blur(12px); }
    .variant-b .grid { display: block; }
    .variant-b .clip-card { height: auto; min-height: 164px; margin-bottom: 9px; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; }
    .variant-b .card-top, .variant-b .excerpt-wrap, .variant-b .source { grid-column: 1; }
    .variant-b .excerpt { font-size: 15px; -webkit-line-clamp: 2; }
    .variant-b .derived { display: none; }
    .variant-b .card-actions { grid-row: 1 / -1; grid-column: 2; flex-direction: column; justify-content: center; border-top: 0; border-left: 1px solid var(--border); padding: 0 0 0 9px; }
    .variant-b .card-action span { display: none; }
    .variant-c .content { padding-bottom: 156px; }
    .variant-c .clip-card { height: 254px; }
    .variant-c .card-actions { opacity: .24; transition: opacity 140ms ease; }
    .variant-c .clip-card:hover .card-actions, .variant-c .clip-card.selected .card-actions { opacity: 1; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    @media (max-width: 760px) {
      .app { width: 100%; min-height: 100vh; margin: 0 0 92px; border: 0; border-radius: 0; }
      .header { min-height: 66px; padding: 12px 14px; }
      .brand-icon { width: 38px; height: 38px; flex-basis: 38px; }
      .tabs { padding-inline: 8px; }
      .tab { height: 44px; font-size: 14px; }
      .toolbar { padding: 10px 12px; }
      .hint { padding-inline: 12px; }
      .tag-row { padding-inline: 12px; }
      .content { padding: 0 12px 116px; }
      .grid { grid-template-columns: 1fr; }
      .clip-card { height: 262px; padding: 13px; }
      .excerpt { font-size: 16px; -webkit-line-clamp: 4; }
      .action-label, .summary-copy, .batch-secondary { display: none; }
      .batch-bar { right: 10px; bottom: 62px; left: 10px; min-height: 58px; padding: 8px; border-radius: 16px; }
      .batch-summary { min-width: 38px; padding: 0 5px; }
      .action { width: 40px; height: 40px; padding: 0; }
      .action.primary { margin-left: auto; }
      .action-menu { right: 6px; }
      .variant-b .clip-card { grid-template-columns: 1fr; }
      .variant-b .card-actions { grid-row: auto; grid-column: 1; flex-direction: row; justify-content: flex-start; border-top: 1px solid var(--border); border-left: 0; padding: 8px 0 0; }
      .variant-b .card-action span { display: inline; }
      .command-grid { grid-template-columns: repeat(2, 1fr); }
      .tray { right: 9px; bottom: 62px; left: 9px; min-height: 62px; grid-template-columns: 1fr auto; padding: 8px; }
      .tray-list { display: none; }
      .tray-item { display: none; }
      .tray-title { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
      .tray-title strong, .tray-title span { display: block; }
      .tray-title span { color: var(--text-3); font-size: 9px; }
      .tray-actions .action:not(.primary) { display: none; }
      .focus-body { padding: 18px; }
      .focus-body article { font-size: 16px; }
      .state-line { display: none; }
      .variant-label { min-width: 140px; }
    }
  </style>
</head>
<body>
  <main id="root"></main>
  <div class="toast" id="toast"></div>
  <div class="composer-demo" id="composer-demo"><strong>已加入主输入框</strong><br>正文不会展开为黑色文本，发送时再解析。<div class="composer-chip" id="composer-chip">引用枝签 0</div></div>
  <div class="focus-backdrop" id="focus-backdrop" aria-hidden="true">
    <section class="focus-panel" role="dialog" aria-modal="true" aria-label="枝签全文">
      <header class="focus-header"><strong id="focus-title">枝签全文</strong><button class="icon-btn" id="focus-close" aria-label="关闭">×</button></header>
      <div class="focus-body"><article id="focus-text"></article></div>
      <footer class="focus-footer"><button class="action" id="focus-copy">复制正文</button><button class="action primary" id="focus-reference">引用到输入框</button></footer>
    </section>
  </div>
  <script type="module" src="/prototype.js"></script>
</body>
</html>
